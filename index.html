<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 50px 20px;
        }

        main {
            padding: 40px 20px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>This website is hosted on GitHub Pages.</p>
    </header>

    <main>
        <h2>About Me</h2>
        <p>Hello! I'm learning how to create websites.</p>

        <button>Click Me</button>
    </main>

</body>
</html>
